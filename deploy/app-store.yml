# Tikspot custom App store for RouterOS 7.22+ — GENERATED from tikspot.app.yml
# (regenerate with: node scripts/gen-app-store.mjs). Point a router at the raw URL of this
# file to list Tikspot in its App list:
#
#   /app/settings set app-store-urls="https://raw.githubusercontent.com/krusherdom/tinkernet-tikspot/main/deploy/app-store.yml"
#
# then enable and configure it like any other App (see docs/deploy-app.md).

- name: tikspot
  descr: Captive portal + FreeRADIUS hotspot manager for MikroTik
  page: https://github.com/krusherdom/tinkernet-tikspot
  category: network
  default-credentials: admin password = TIKSPOT_ADMIN_PASSWORD (or set in the first-run wizard)
  url-path: /admin
  supported-archs:
    - arm64
    - x86

  # Declared so they can be referenced as [secret:name] below instead of being typed into
  # the environment in clear text. Unset secrets are ignored by the container.
  secrets:
    admin_password:
    router_password:
    nas_secret:

  services:
    tikspot:
      # Multi-arch public image (arm64 + amd64) published by the repo's release workflow.
      # Pin a release tag for production; RouterOS pulls the variant matching the router's CPU.
      image: ghcr.io/krusherdom/tinkernet-tikspot:0.17.1
      container_name: tikspot
      hostname: tikspot
      restart: unless-stopped
      ports:
        # Admin UI + captive portal (HTTP), published on the router at :8088 and proxied as
        # the App's UI URL. Hotspot guests reach the portal at the container's own IP on :80
        # (walled-garden entry added by auto-configure); RADIUS (1812/1813) is reached by the
        # router directly on the container IP, so it needs no mapping here.
        - "8088:80:web"
      volumes:
        # Persistent: database (plans, vouchers, accounts, designs, settings), branding
        # uploads. Put a backup zip at data/import/backup.zip to restore it on first boot.
        - "data:/data"
      healthcheck:
        test: ["CMD", "curl -fsS http://localhost/healthz || exit 1"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 40s
      environment:
        # ---- how the supplied values are applied ---------------------------------------
        # seed    = only fill settings that are still unset (changes made in the UI stick)
        # enforce = these values win on every boot
        TIKSPOT_BOOTSTRAP: seed

        # ---- admin ---------------------------------------------------------------------
        TIKSPOT_ADMIN_PASSWORD: "[secret:admin_password]"
        # Locked out? Set this to 1, restart the app once, then set it back to 0.
        TIKSPOT_ADMIN_PASSWORD_RESET: "0"

        # ---- where the container lives / how it reaches the router ----------------------
        TIKSPOT_CONTAINER_IP: "[containerIP]"
        TIKSPOT_ROUTER_HOST: "[routerIP]"
        TIKSPOT_ROUTER_SCHEME: http
        TIKSPOT_ROUTER_USER: tikspot
        TIKSPOT_ROUTER_PASSWORD: "[secret:router_password]"
        TIKSPOT_NAS_SECRET: "[secret:nas_secret]"

        # ---- portal identity ------------------------------------------------------------
        # A REAL hostname you control (never .local, never a made-up TLD): it becomes the
        # hotspot server's name and the URL guests are sent to. Defaults to the container IP.
        TIKSPOT_SERVER_NAME: "[containerIP]"
        TIKSPOT_PORTAL_TITLE: "Connect to Wi-Fi"

        # ---- configure the router at boot (needs the API user above) ---------------------
        # 1 = once per configuration, always = every boot, 0 = never (use the UI instead)
        TIKSPOT_AUTOCONFIGURE: "1"
        # Guest bridge/interface to run the hotspot on. Leave empty to manage only the
        # RADIUS client, DNS static and walled garden and create the hotspot yourself.
        TIKSPOT_HOTSPOT_INTERFACE: ""
        # Optional name for the router's own hotspot endpoint; must differ from the server name.
        TIKSPOT_HOTSPOT_DNS_NAME: ""

        # ---- optional: guest-lookup plugin ------------------------------------------------
        # A bundled recipe id (e.g. rms-cloud-surname-room), a file under /data, or an https URL.
        TIKSPOT_PLUGIN: ""
        TIKSPOT_PLUGIN_ENABLED: "1"
        TIKSPOT_PLUGIN_ATTACH: "1"
        # Recipe secrets/params are passed as TIKSPOT_PLUGIN_SECRET_<key> / TIKSPOT_PLUGIN_PARAM_<key>,
        # e.g. TIKSPOT_PLUGIN_SECRET_clientId, TIKSPOT_PLUGIN_PARAM_moduleType.

        # ---- optional: restore a backup on first boot --------------------------------------
        TIKSPOT_RESTORE_FILE: /data/import/backup.zip
        TIKSPOT_RESTORE_MODE: fresh
