name: release

# Publish a multi-arch (arm64 + amd64) image to the GitHub Container Registry when a
# version tag is pushed (e.g. `git tag v0.9.0 && git push origin v0.9.0`). The image
# becomes pullable at ghcr.io/<owner>/<repo>, which is what deploy/tikspot.app.yml
# references so a MikroTik can pull it directly.
#
# One-time: after the first publish, set the GHCR package visibility to **Public**
# (repo → Packages → tikspot package → Package settings → Change visibility) so anyone
# can pull it without credentials.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (arm64 + amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64,linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
